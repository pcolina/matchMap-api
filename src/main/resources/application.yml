matchmap:
  auth:
    jwt-secret: ${MATCHMAP_JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    max-failed-logins: 5
    failed-login-window: 15m
    google:
      client-ids: ${MATCHMAP_GOOGLE_CLIENT_IDS:}
    refresh-cookie:
      same-site: ${MATCHMAP_REFRESH_COOKIE_SAMESITE:Lax}
  cors:
    allowed-origins: ${MATCHMAP_CORS_ALLOWED_ORIGINS:http://localhost:4300}

spring:
  application:
    name: matchmap-api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
      show-details: never
      probes:
        enabled: false
  health:
    defaults:
      enabled: false
