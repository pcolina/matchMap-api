matchmap:
  auth:
    jwt-secret: ${MATCHMAP_JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    max-failed-logins: 5
    failed-login-window: 15m

spring:
  application:
    name: matchmap-api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
      show-details: never
      probes:
        enabled: false
  health:
    defaults:
      enabled: false
